# Run by hand: the fileIDs Unity gives a model's objects (for the on-phone VRChat import), from ufbx's test models.
name: fileIDs probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          docker-images: true
      - name: Test models
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ufbx/ufbx /tmp/ufbx
          cd /tmp/ufbx && git sparse-checkout set data
          mkdir -p "$GITHUB_WORKSPACE/Assets/FileIdProbe"
          for f in blender_293_barbarian_7400_binary maya_human_ik_7400_binary blender_279_nested_meshes_7400_binary blender_293_half_skinned_7400_binary blender_293_instancing_7400_binary blender_suzanne_multimaterial_7400_binary blender_279_default_7400_binary maya_cube_7400_binary; do
            cp "data/$f.fbx" "$GITHUB_WORKSPACE/Assets/FileIdProbe/" || true
          done
          ls -la "$GITHUB_WORKSPACE/Assets/FileIdProbe"
      - name: Unity
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project -e UNITY_EMAIL -e UNITY_PASSWORD \
            unityci/editor:ubuntu-6000.3.28f1-ios-3 bash /project/ci/fileids.sh
      - name: The list on the probe-results branch
        if: always()
        run: |
          sudo chown -R "$(id -u)" . || true
          mkdir -p /tmp/out && cp fileids.txt probe.log /tmp/out/ 2>/dev/null || true
          git config user.name "fileids probe"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan probe-results
          git rm -rf --cached . > /dev/null
          cp /tmp/out/* . 2>/dev/null || true
          git add fileids.txt probe.log 2>/dev/null || true
          git commit -m "fileIDs probe" && git push -f origin probe-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fileids
          path: |
            fileids.txt
            probe.log
