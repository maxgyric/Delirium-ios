# The game's native code for iOS: Delirium (GPL-3.0, from delirium-physics 0.7.0: delirium, delirium-data,
# delirium-sdk) and delirium_anim (CS-Delirium/anim), linked into ONE static library, libdelirium_ios.a, because
# two Rust static libraries in one app clash (each carries its own copy of Rust's std).
# Build: cargo build --release -p delirium-ios --target aarch64-apple-ios
[workspace]
members = ["crates/delirium-data", "crates/delirium", "crates/delirium-sdk", "anim", "bike", "ios"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[profile.release]
opt-level = 3
codegen-units = 4
