[package]
name = "delirium-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "delirium_ios"
crate-type = ["staticlib"]

[dependencies]
delirium-sdk = { path = "../crates/delirium-sdk" }
delirium-anim = { path = "../anim" }
delirium-bike = { path = "../bike" }
delirium-sound = { path = "../sound" }
# BLAKE3 in plain Rust: no C compiled for the phone (the build runs on Linux)
blake3 = { version = "1", features = ["pure"] }
